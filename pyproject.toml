[project]
name = "fitsearch"
version = "2.17.6"
description = "Métamoteur de recherche local, léger et sans Docker"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9,<1",
  "argon2-cffi>=23,<26",
]

[project.scripts]
fitsearch = "fitsearch.main:run"
fitsearch-accounts = "fitsearch.accounts:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
fitsearch = ["templates/*.html", "static/*"]

[tool.setuptools.packages.find]
include = ["fitsearch*"]
